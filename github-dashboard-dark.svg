    <style>

      .mono {
        font-family:
          "SFMono-Regular",
          "Cascadia Code",
          "Liberation Mono",
          Menlo,
          monospace;
      }

      .title {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-weight: 700;
      }

      @keyframes blink {
        0%, 49% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: .45;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-3px);
        }
      }

      .cursor {
        animation:
          blink 1s step-end infinite;
      }

      .online {
        animation:
          pulse 2s ease-in-out infinite;
      }

      .float {
        animation:
          float 3s ease-in-out infinite;
      }

    </style>

